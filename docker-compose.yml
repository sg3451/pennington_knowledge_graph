# =============================================================================
# Pennington Biomedical Knowledge Graph — Docker Compose
# =============================================================================
#
# Starts two services:
#   1. neo4j    — graph database (port 7474 browser, 7687 bolt)
#   2. streamlit — web application (port 8501)
#
# Usage:
#   docker compose up -d          # start both services in background
#   docker compose down           # stop both services
#   docker compose logs -f        # watch live logs
#   docker compose restart        # restart after config changes
#
# First-time setup on a new machine:
#   1. Copy this file + your project folder to the new machine
#   2. Run:  docker compose up -d
#   3. Wait ~60 seconds for Neo4j to initialize
#   4. Activate conda env and run:  python 04_load_neo4j.py
#   5. Open browser at http://localhost:8501
#
# =============================================================================

services:

  # ── Neo4j graph database ──────────────────────────────────────────────────
  neo4j:
    image: neo4j:community
    container_name: pennington_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt protocol (used by Python driver)
    environment:
      NEO4J_AUTH: neo4j/THakurthakur2020!
      # Memory settings — adjust based on available RAM
      # 8GB machine:  heap 1G/2G, pagecache 2G
      # 16GB machine: heap 2G/4G, pagecache 4G  (recommended)
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "2G"
      # Allow connections from the Streamlit container
      NEO4J_dbms_connector_bolt_listen__address: "0.0.0.0:7687"
      NEO4J_dbms_connector_http_listen__address: "0.0.0.0:7474"
    volumes:
      # Persist database across container restarts
      - pennington_neo4j_data:/data
      - pennington_neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Streamlit web application ─────────────────────────────────────────────
  streamlit:
    image: python:3.11-slim
    container_name: pennington_streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"   # Web UI (http://localhost:8501)
    working_dir: /app
    volumes:
      # Mount your project folder into the container
      # Update the left side of the colon to your actual project path
      - .:/app
    environment:
      # Neo4j connection — points to the neo4j service above
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: THakurthakur2020!
      # Add your Anthropic API key here for the Ask a Question feature
      # Or leave blank to disable that feature
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: >
      bash -c "
        pip install --quiet streamlit plotly pandas neo4j python-dotenv &&
        streamlit run 05_streamlit.py
          --server.port=8501
          --server.address=0.0.0.0
          --server.headless=true
          --browser.gatherUsageStats=false
      "
    depends_on:
      neo4j:
        condition: service_healthy

# ── Named volumes (data persists across container restarts) ───────────────────
volumes:
  pennington_neo4j_data:
    name: pennington_neo4j_data
  pennington_neo4j_logs:
    name: pennington_neo4j_logs
